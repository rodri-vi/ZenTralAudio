name: Build Windows Portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de desarrollo y runtime CPU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar FFmpeg real (no shim) y añadirlo al PATH
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $realBin = Get-ChildItem -Path "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Length -gt 1000000 } | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $realBin) {
            throw "No se encontró el binario real de ffmpeg.exe tras instalar con choco."
          }
          "$realBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$realBin\ffmpeg.exe" -version

      - name: Comprobar entorno e importación de todos los módulos
        shell: pwsh
        run: |
          python scripts/check_environment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_resources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ejecutar pruebas automatizadas (unit e integration)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v -m "unit or integration"

      - name: Compilar aplicación portable con PyInstaller y verificar ZenTralAudio.exe
        run: |
          python scripts/build_windows.py --bundle-ffmpeg --smoke-test

      - name: Verificar existencia de ZenTralAudio.exe y archivo ZIP portable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ZenTralAudio_Portable/ZenTralAudio.exe")) {
            throw "Falta dist/ZenTralAudio_Portable/ZenTralAudio.exe"
          }
          if (!(Test-Path "dist/ZenTralAudio-Windows-Portable.zip")) {
            throw "Falta dist/ZenTralAudio-Windows-Portable.zip"
          }
          Get-Item "dist/ZenTralAudio-Windows-Portable.zip"

      - name: Subir artefacto portable de Windows
        uses: actions/upload-artifact@v4
        with:
          name: ZenTralAudio-Windows-Portable
          path: dist/ZenTralAudio-Windows-Portable.zip
          if-no-files-found: error
