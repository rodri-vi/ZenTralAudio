name: Build Windows Offline AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-offline.yml"
      - "requirements-offline-build.txt"
      - "scripts/build_offline.py"
      - "scripts/build_windows.py"
      - "main.py"
      - "packaging/ZenTralAudio.spec"
      - "models/**"
      - "resources/manifests/models_manifest.json"
      - "tests/test_model_registry.py"

permissions:
  contents: write

jobs:
  build-offline-ai:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias base
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar runtimes IA fijados para Offline AI
        run: |
          pip install -r requirements-offline-build.txt
          python -c "import torch, torchaudio, torchvision, clearvoice, voicefixer, df; print('torch', torch.__version__); print('torchaudio', torchaudio.__version__); print('torchvision', torchvision.__version__)"

      - name: Instalar FFmpeg real y añadirlo al PATH
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $realBin = Get-ChildItem -Path "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Length -gt 1000000 } | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $realBin) {
            throw "No se encontró el binario real de ffmpeg.exe."
          }
          "$realBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$realBin\ffmpeg.exe" -version

      - name: Comprobar entorno y recursos
        shell: pwsh
        run: |
          python scripts/check_environment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_resources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ejecutar pruebas automatizadas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v -m "unit or integration"

      - name: Descargar pesos y construir ZenTralAudio Offline AI
        run: python scripts/build_offline.py --bundle-ffmpeg

      - name: Verificar paquete Offline AI
        shell: pwsh
        run: |
          $assets = @()
          $zip = "dist/ZenTralAudio-Offline-AI.zip"
          if (Test-Path $zip) { $assets += Get-Item $zip }
          $parts = Get-ChildItem "dist/ZenTralAudio-Offline-AI.zip.part*" -ErrorAction SilentlyContinue
          foreach ($part in $parts) { $assets += $part }
          if ($assets.Count -eq 0) {
            throw "No se encontró el ZIP ni las partes del paquete Offline AI."
          }
          if (!(Test-Path "dist/RELEASE_NOTES_OFFLINE_AI.md")) {
            throw "Faltan las instrucciones de descarga y extracción."
          }
          if (!(Test-Path "dist/ZenTralAudio_Portable/ZenTralAudio.exe")) {
            throw "Falta el ejecutable principal."
          }
          if (!(Test-Path "dist/ZenTralAudio_Portable/runtimes/ZenTralModelWorker/ZenTralModelWorker.exe")) {
            throw "Falta el worker de inferencia offline."
          }
          $assets | Select-Object Name,Length

      - name: Preparar lista de assets de GitHub Release
        id: release_assets
        shell: pwsh
        run: |
          $assets = @()
          $zip = "dist/ZenTralAudio-Offline-AI.zip"
          if (Test-Path $zip) { $assets += $zip }
          $parts = Get-ChildItem "dist/ZenTralAudio-Offline-AI.zip.part*" -ErrorAction SilentlyContinue
          foreach ($part in $parts) { $assets += $part.FullName }
          if ($assets.Count -eq 0) { throw "No hay archivos para publicar." }
          "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publicar ZenTralAudio Offline AI en GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: offline-ai-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: ZenTralAudio Offline AI
          body_path: dist/RELEASE_NOTES_OFFLINE_AI.md
          files: ${{ steps.release_assets.outputs.files }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
